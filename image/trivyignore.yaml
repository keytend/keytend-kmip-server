# Reviewed image findings (Trivy ignore file; scripts/scan_image.py passes it
# with --ignorefile for every platform). An entry records that a finding was
# reviewed, not that it is fixed: each one has no Red Hat Enterprise Linux 9
# fix at review time, and a finding with a fixed version fails the scan anyway,
# because the remedy then is to update the package pin. Statements name the
# package and the reason the finding does not need an image change.
# Add an entry only with a statement; see docs/testing.md (Reviewing image scanner findings).
vulnerabilities:
  # glibc
  - id: CVE-2026-84243
    statement: "glibc message translation in a non-C locale. The server binary, libssl, libcrypto, libgcc_s and libz import no setlocale, uselocale, newlocale, gettext or textdomain entry point, so the process stays in the C locale where glibc ignores LANGUAGE."
  - id: CVE-2026-97399
    statement: "glibc Power8-optimised implementation. The image is linux/amd64 or linux/arm64."
  - id: CVE-2026-122054
    statement: "glibc iconv BIG5-HKSCS conversion. The image ships no BIG5HKSCS gconv module (only UTF-7, UTF-16, UTF-32, UNICODE, ISO8859-1, ISO8859-15 and CP1252), and the server binary, libssl, libcrypto, libgcc_s and libz import no iconv entry point."
  # libgcc (matched through the gcc source package)
  - id: CVE-2026-125709
    statement: "gcc libstdc++ file stream buffer overflow after a failed single-character write. libstdc++ is not shipped; only libgcc_s is, and the server binary does not link libstdc++."
  - id: CVE-2021-46195
    statement: "gcc libiberty demangler (binutils/gcc tools). It is not part of libgcc and is not shipped."
  - id: CVE-2022-27943
    statement: "gcc libiberty demangler (binutils/gcc tools). It is not part of libgcc and is not shipped."
  # zlib
  - id: CVE-2026-27171
    statement: "zlib crc32_combine family. None of these functions is imported by the server binary, libssl, libcrypto, libgcc_s or libz."
  # openssl-libs
  - id: CVE-2024-13176
    statement: "OpenSSL ECDSA timing, reachable. The server signs with ECDSA (KMIP Sign), including P-521; Red Hat defers the fix and the FIPS provider build implements the same ECDSA code."
  - id: CVE-2024-41996
    statement: "OpenSSL finite-field DHE, non-default configuration. The default modern TLS policy (src/fips.rs) and the server-to-client connector offer no DHE suite and no FFDHE group; only --tls-profile mozilla-intermediate enables them. Impact is server CPU cost."
  - id: CVE-2025-9232
    statement: "OpenSSL HTTP client. The OSSL_HTTP client functions are not imported; the server is an HTTPS server only."
  - id: CVE-2026-28387
    statement: "OpenSSL DANE TLSA authentication. The SSL_dane functions are not imported; DANE is never enabled."
  - id: CVE-2026-28388
    statement: "OpenSSL delta CRLs. Needs X509_V_FLAG_USE_DELTAS, which the server source never sets; CRLs are complete CRLs supplied with KMIP_CRL."
  - id: CVE-2026-28389
    statement: "OpenSSL CMS/PKCS#7 decryption. CMS_decrypt and PKCS7_decrypt are not imported."
  - id: CVE-2026-31789
    statement: "OpenSSL, 32-bit systems only. The image is linux/amd64 or linux/arm64."
  - id: CVE-2026-42765
    statement: "OpenSSL partial-chain verification with whole-chain OCSP checking. The server source sets neither a PARTIAL_CHAIN nor an OCSP verification flag."
