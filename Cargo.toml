[workspace]
# The audited unsafe FFI calls live in their own crates so this crate keeps
# forbidding unsafe code: OSSL_PROVIDER_get_params (docs/fips.md) and the
# ML-KEM, ML-DSA and SLH-DSA calls (docs/algorithms.md#post-quantum-keys).
members = ["crates/ossl-provider-info", "crates/ossl-pqc"]

[package]
name = "keytend-kmip-server"
version = "0.10.0-rc.1"
edition = "2024"
license = "Apache-2.0"
authors = ["Jeremiah Jordan"]
rust-version = "1.92"
description = "Keytend KMIP server: mutually authenticated KMIP key lifecycle service"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
crypto-bigint = { version = "=0.7.10", default-features = false, features = ["alloc", "zeroize"] }
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
openssl = "0.10"
ossl-pqc = { path = "crates/ossl-pqc" }
ossl-provider-info = { path = "crates/ossl-provider-info" }
quick-xml = "0.42.0"
rusqlite = { version = "0.41", features = ["bundled"] }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-openssl = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
proptest = "1"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"
