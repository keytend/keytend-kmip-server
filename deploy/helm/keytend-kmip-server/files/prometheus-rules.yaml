# Suggested Prometheus alert rules for keytend-kmip-server (docs/metrics.md#alerts).
# Adjust `job` to your scrape configuration and the thresholds to your traffic.
# absent() makes the outage alerts fire when no target is scraped at all, for
# example when Kubernetes discovery drops the only pod.
# Check with: promtool check rules keytend-kmip-server-rules.yaml
#             promtool test rules keytend-kmip-server-rules.test.yaml
groups:
  - name: keytend-kmip-server
    rules:
      - alert: KmipServerDown
        expr: up{job="keytend-kmip-server"} == 0 or kmip_ready == 0 or absent(up{job="keytend-kmip-server"})
        for: 2m
        annotations:
          summary: Server down, not ready or not scraped (readiness includes the live-history check).
      - alert: KmipLeaseOutageBudget
        # KmipServerDown's expression with a longer for = (1 - r) * L / 2,
        # L = 3600 s, r = 0.5 (see Lease-outage alerts).
        expr: up{job="keytend-kmip-server"} == 0 or kmip_ready == 0 or absent(up{job="keytend-kmip-server"})
        for: 15m
        annotations:
          summary: Half of the default lease remainder is gone; lease-honouring clients stop in about 15 minutes.
      - alert: KmipLeaseTimeChanged
        expr: changes(kmip_lease_max_seconds[1h]) > 0
        annotations:
          summary: --max-lease-seconds changed; update the KmipLeaseOutageBudget duration.
      - alert: KmipFipsProviderError
        expr: kmip_fips_provider_status{provider="fips"} != 1
        annotations:
          summary: The FIPS provider entered its error state; restart and investigate.
      - alert: KmipUnansweredRequests
        expr: increase(kmip_requests_unanswered_total[10m]) > 0
        annotations:
          summary: Internal failures or responses that could not be sized.
      - alert: KmipServerSideFailures
        expr: sum without (version, encoding, operation, status, reason) (increase(kmip_operations_total{reason=~"GeneralFailure|InternalServerError|ProtectionStorageUnavailable"}[10m])) > 0
        annotations:
          summary: Failures that clients cannot fix by changing their requests.
      - alert: KmipLeaseRefusals
        expr: sum without (reason) (increase(kmip_leases_refused_total[15m])) > 0
        annotations:
          summary: A client renews a lease for an object it can no longer use.
      - alert: KmipCertificateTrouble
        expr: sum without (listener) (increase(kmip_tls_handshake_failures_total{reason=~"no_client_certificate|certificate_rejected|peer_alert"}[15m])) > 0 or sum without (listener) (increase(kmip_connections_refused_unlisted_total[15m])) > 0
        annotations:
          summary: Expired or rotated client certificates, a CRL revoking a client, or a certificate missing from the policy.
      - alert: KmipConnectionCapacity
        expr: sum without (listener) (kmip_connections_active) / kmip_connections_max > 0.8
        for: 10m
        annotations:
          summary: --max-connections is nearly exhausted; idle connections hold slots until --idle-timeout.
      - alert: KmipConnectionAdmissionWaiting
        expr: kmip_connection_admission_waiting > 0
        for: 5m
        annotations:
          summary: Connections are waiting for a free slot.
      - alert: KmipStoreIntegrity
        expr: kmip_objects_unreadable > 0
        annotations:
          summary: A record no longer authenticates; run check-store on a backup.
      - alert: KmipCensusStalled
        expr: kmip_object_census_interval_seconds > 0 and time() - kmip_object_census_timestamp_seconds > 3 * kmip_object_census_interval_seconds
        annotations:
          summary: The object census or the engine is stuck.
      - alert: KmipDiskGrowth
        # 0.8 of the 10 Gi PVC of the supplied StatefulSet; adjust to your volume.
        expr: predict_linear(kmip_store_database_bytes[6h], 7 * 86400) > 0.8 * 10737418240
        annotations:
          summary: The data volume is filling.
  # Needs Prometheus to scrape the kubelet; names the supplied StatefulSet's PVC.
  - name: keytend-kmip-server-kubernetes
    rules:
      - alert: KmipVolumeFreeSpace
        expr: kubelet_volume_stats_available_bytes{namespace="keytend-kmip-server", persistentvolumeclaim="data-keytend-kmip-server-0"} / kubelet_volume_stats_capacity_bytes{namespace="keytend-kmip-server", persistentvolumeclaim="data-keytend-kmip-server-0"} < 0.2
        for: 15m
        annotations:
          summary: Less than 20 % of the data volume is free.
