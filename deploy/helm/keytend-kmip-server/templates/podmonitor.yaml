{{- if .Values.metrics.podMonitor.enabled }}
# Scrapes /metrics on the health port; job is the app.kubernetes.io/name label,
# as the PrometheusRule expects.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "kmip.fullname" . }}
  labels:
    {{- include "kmip.labels" . | nindent 4 }}
    {{- with .Values.metrics.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      {{- include "kmip.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  podMetricsEndpoints:
    - port: health
      path: /metrics
      interval: {{ .Values.metrics.podMonitor.interval }}
      {{- with .Values.metrics.podMonitor.scrapeTimeout }}
      scrapeTimeout: {{ . }}
      {{- end }}
{{- end }}
