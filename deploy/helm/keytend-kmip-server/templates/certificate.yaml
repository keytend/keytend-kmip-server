{{- if .Values.tls.certManager.enabled }}
{{- $cm := .Values.tls.certManager }}
{{- $fullname := include "kmip.fullname" . }}
# The server certificate, issued into the TLS Secret by cert-manager.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "kmip.labels" . | nindent 4 }}
spec:
  secretName: {{ include "kmip.tlsSecret" . }}
  issuerRef:
    name: {{ $cm.issuerRef.name }}
    kind: {{ $cm.issuerRef.kind }}
    group: {{ $cm.issuerRef.group }}
  dnsNames:
    - {{ $fullname }}
    - {{ $fullname }}.{{ .Release.Namespace }}
    - {{ $fullname }}.{{ .Release.Namespace }}.svc
    - {{ $fullname }}.{{ .Release.Namespace }}.svc.{{ $cm.clusterDomain }}
    {{- range $cm.dnsNames }}
    - {{ . }}
    {{- end }}
  {{- with $cm.ipAddresses }}
  ipAddresses:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  duration: {{ $cm.duration }}
  renewBefore: {{ $cm.renewBefore }}
  privateKey:
    algorithm: {{ $cm.privateKey.algorithm }}
    size: {{ $cm.privateKey.size }}
    rotationPolicy: Always
  usages: [digital signature, {{ if eq $cm.privateKey.algorithm "RSA" }}key encipherment, {{ end }}server auth]
{{- end }}
