{{- if .Values.metrics.prometheusRule.enabled }}
{{- $selector := printf "job=\"%s\", namespace=\"%s\"" (include "kmip.name" .) .Release.Namespace }}
{{- /* files/prometheus-rules.yaml is deploy/prometheus/keytend-kmip-server-rules.yaml
(a test keeps them equal); its job, namespace, PVC and volume size are this release's. */}}
{{- $rules := .Files.Get "files/prometheus-rules.yaml"
  | replace "namespace=\"keytend-kmip-server\"" (printf "namespace=\"%s\"" .Release.Namespace)
  | replace "job=\"keytend-kmip-server\"" $selector
  | replace "data-keytend-kmip-server-0" (include "kmip.dataClaim" .)
  | replace "10737418240" (include "kmip.bytes" .Values.persistence.size)
  | fromYaml }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "kmip.fullname" . }}
  labels:
    {{- include "kmip.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    {{- toYaml $rules.groups | nindent 4 }}
    {{- if .Values.backup.enabled }}
    {{- $age := int .Values.metrics.prometheusRule.backupMaxAgeSeconds }}
    - name: keytend-kmip-server-backup
      rules:
        - alert: KmipBackupStale
          # kmip_last_backup_timestamp_seconds is 0 until the first backup.
          expr: (kmip_last_backup_timestamp_seconds{ {{- $selector -}} } > 0 and time() - kmip_last_backup_timestamp_seconds{ {{- $selector -}} } > {{ $age }}) or (kmip_last_backup_timestamp_seconds{ {{- $selector -}} } == 0 and time() - process_start_time_seconds{ {{- $selector -}} } > {{ $age }})
          annotations:
            summary: No successful backup for longer than {{ $age }} seconds; check the {{ include "kmip.fullname" . }}-backup CronJob.
    {{- end }}
{{- end }}
