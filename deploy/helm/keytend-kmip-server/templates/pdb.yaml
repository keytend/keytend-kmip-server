{{- if .Values.podDisruptionBudget.enabled }}
# One replica: maxUnavailable 0 blocks voluntary evictions (drains wait until
# the server is stopped with maintenance.enabled); 1 permits them.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kmip.fullname" . }}
  labels:
    {{- include "kmip.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "kmip.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
{{- end }}
