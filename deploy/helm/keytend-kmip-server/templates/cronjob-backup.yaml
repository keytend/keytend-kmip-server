{{- if .Values.backup.enabled }}
{{- $b := .Values.backup }}
# Scheduled backup on the server's node: backup --output-dir /backups --retain N
# writes and verifies backup-<UTC time>.sqlite, updates latest.json and the
# server's kmip_last_backup_timestamp_seconds. Run one now with
#   kubectl create job --from=cronjob/{{ include "kmip.fullname" . }}-backup <name>
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "kmip.fullname" . }}-backup
  labels:
    {{- include "kmip.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ $b.schedule | quote }}
  {{- with $b.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ $b.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ $b.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ $b.failedJobsHistoryLimit }}
  jobTemplate:
    metadata:
      labels:
        {{- include "kmip.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backup
    spec:
      backoffLimit: {{ $b.backoffLimit }}
      activeDeadlineSeconds: {{ $b.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "kmip.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          {{- include "kmip.backupPod" (dict "root" . "retain" $b.retain "ifExists" false "keys" (splitList "," (include "kmip.candidateKeys" .))) | nindent 10 }}
{{- end }}
