apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keytend-kmip-server
  namespace: keytend-kmip-server
spec:
  podSelector:
    matchLabels:
      app: keytend-kmip-server
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kmip-client: 'true'
          podSelector:
            matchLabels:
              access: keytend-kmip-server
      ports:
        - protocol: TCP
          port: 5696
        - protocol: TCP
          port: 5697
    # Prometheus scrapes of /metrics on the plain-HTTP health listener
    # (docs/metrics.md#scraping). Label the scraper's namespace
    # and pods, or adapt the selectors.
    - from:
        - namespaceSelector:
            matchLabels:
              kmip-metrics: 'true'
          podSelector:
            matchLabels:
              access: keytend-kmip-server-metrics
      ports:
        - protocol: TCP
          port: 8080
  egress: []
