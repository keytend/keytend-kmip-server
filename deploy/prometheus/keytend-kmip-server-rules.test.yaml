# Unit tests for keytend-kmip-server-rules.yaml:
#   promtool test rules keytend-kmip-server-rules.test.yaml
rule_files:
  - keytend-kmip-server-rules.yaml
evaluation_interval: 1m
tests:
  # The target is scraped but down.
  - interval: 1m
    input_series:
      - series: 'up{job="keytend-kmip-server", instance="kmip:8080"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 1m
        alertname: KmipServerDown
        exp_alerts: []
      - eval_time: 3m
        alertname: KmipServerDown
        exp_alerts:
          - exp_labels: {job: keytend-kmip-server, instance: "kmip:8080"}
            exp_annotations:
              summary: Server down, not ready or not scraped (readiness includes the live-history check).
      - eval_time: 14m
        alertname: KmipLeaseOutageBudget
        exp_alerts: []
      - eval_time: 16m
        alertname: KmipLeaseOutageBudget
        exp_alerts:
          - exp_labels: {job: keytend-kmip-server, instance: "kmip:8080"}
            exp_annotations:
              summary: Half of the default lease remainder is gone; lease-honouring clients stop in about 15 minutes.
  # Up and ready, then service discovery drops the only target.
  - interval: 1m
    input_series:
      - series: 'up{job="keytend-kmip-server", instance="kmip:8080"}'
        values: '1x4 stale'
      - series: 'kmip_ready{job="keytend-kmip-server", instance="kmip:8080"}'
        values: '1x4 stale'
    alert_rule_test:
      - eval_time: 4m
        alertname: KmipServerDown
        exp_alerts: []
      - eval_time: 6m
        alertname: KmipServerDown
        exp_alerts: []
      - eval_time: 8m
        alertname: KmipServerDown
        exp_alerts:
          - exp_labels: {job: keytend-kmip-server}
            exp_annotations:
              summary: Server down, not ready or not scraped (readiness includes the live-history check).
      - eval_time: 19m
        alertname: KmipLeaseOutageBudget
        exp_alerts: []
      - eval_time: 21m
        alertname: KmipLeaseOutageBudget
        exp_alerts:
          - exp_labels: {job: keytend-kmip-server}
            exp_annotations:
              summary: Half of the default lease remainder is gone; lease-honouring clients stop in about 15 minutes.
  # No target was ever scraped.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 3m
        alertname: KmipServerDown
        exp_alerts:
          - exp_labels: {job: keytend-kmip-server}
            exp_annotations:
              summary: Server down, not ready or not scraped (readiness includes the live-history check).
      - eval_time: 16m
        alertname: KmipLeaseOutageBudget
        exp_alerts:
          - exp_labels: {job: keytend-kmip-server}
            exp_annotations:
              summary: Half of the default lease remainder is gone; lease-honouring clients stop in about 15 minutes.
  # Healthy: no outage alert.
  - interval: 1m
    input_series:
      - series: 'up{job="keytend-kmip-server", instance="kmip:8080"}'
        values: '1x30'
      - series: 'kmip_ready{job="keytend-kmip-server", instance="kmip:8080"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: KmipServerDown
        exp_alerts: []
      - eval_time: 30m
        alertname: KmipLeaseOutageBudget
        exp_alerts: []
  # Connections near the limit for 10 minutes.
  - interval: 1m
    input_series:
      - series: 'kmip_connections_active{job="keytend-kmip-server", instance="kmip:8080", listener="ttlv"}'
        values: '60x20'
      - series: 'kmip_connections_max{job="keytend-kmip-server", instance="kmip:8080"}'
        values: '64x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: KmipConnectionCapacity
        exp_alerts: []
      - eval_time: 12m
        alertname: KmipConnectionCapacity
        exp_alerts:
          - exp_labels: {job: keytend-kmip-server, instance: "kmip:8080"}
            exp_annotations:
              summary: --max-connections is nearly exhausted; idle connections hold slots until --idle-timeout.
