# One keytend-kmip-server container, equivalent to the hardened `docker run`
# of docs/deployment.md#docker-or-podman. Prepare /srv/kmip (or KMIP_ROOT) as
# that page describes, put IMAGE in .env next to this file, then:
#
#   docker compose -f /srv/kmip/compose.yaml up -d
#
# After a change to .env (a new IMAGE) or kmip.env, run the same command with
# --force-recreate.
services:
  keytend-kmip-server:
    image: ${IMAGE:?set IMAGE to the image you deploy, by digest}
    container_name: keytend-kmip-server
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 2
    ports:
      - "5696:5696"
      - "5697:5697"
      - "127.0.0.1:8080:8080"
    volumes:
      - ${KMIP_ROOT:-/srv/kmip}/tls:/tls:ro
      - ${KMIP_ROOT:-/srv/kmip}/policy:/policy:ro
      - ${KMIP_ROOT:-/srv/kmip}/master:/master:ro
      - ${KMIP_ROOT:-/srv/kmip}/data:/data
      # With an audit checkpoint (docs/audit-checkpoints.md), uncomment:
      # - ${KMIP_ROOT:-/srv/kmip}/checkpoints:/checkpoints:ro
    env_file: ${KMIP_ROOT:-/srv/kmip}/kmip.env
    # Exec form: the image has no shell. healthcheck does not read
    # KMIP_HEALTH_LISTEN; if kmip.env moves the listener, change --address.
    healthcheck:
      test: ["CMD", "/usr/local/bin/keytend-kmip-server", "healthcheck", "--address", "127.0.0.1:8080"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    stop_grace_period: 30s
    # The json-file driver keeps logs forever unless capped.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
