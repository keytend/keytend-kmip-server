[package]
name = "ossl-pqc"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Jeremiah Jordan"]
rust-version = "1.92"
description = "ML-KEM, ML-DSA and SLH-DSA through the OpenSSL 3.5 default provider"
publish = false

# The versions the server crate already uses (Cargo.lock), so no new crate is added.
[dependencies]
foreign-types = "0.3"
openssl = "0.10"
openssl-sys = "0.9"
zeroize = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
